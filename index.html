<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A7F70">
<title>Ludoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: one phone-width column. Home = settings cards plus a fixed start bar. Game = four player chips, square board as the hero, dice and roll button, emoji reaction strip. */
:root{
  --bg:#F2F5FF; --surface:#FFFFFF; --surface-2:#E9EEFB; --ink:#232047; --muted:#5E5B85; --line:#D3D9F0;
  --accent:#0A7F70; --accent-ink:#FFFFFF; --gold:#FFB300;
  --shadow:0 6px 20px rgba(40,40,110,.12);
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15142B; --surface:#211F40; --surface-2:#2C2A52; --ink:#F1F0FF; --muted:#B1AED8; --line:#3D3A6E;
    --accent:#4FD6C0; --accent-ink:#0C2A25; --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15142B; --surface:#211F40; --surface-2:#2C2A52; --ink:#F1F0FF; --muted:#B1AED8; --line:#3D3A6E;
  --accent:#4FD6C0; --accent-ink:#0C2A25; --shadow:0 6px 20px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:600;margin:0}
h2{font-size:18px;margin-bottom:10px}
.app{max-width:480px;margin:0 auto;padding-block:14px 120px}
.sub{color:var(--muted);font-size:14px;font-weight:600}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}

/* Home */
.hh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:12px}
.logo h1{font-size:32px;line-height:1}
.logo small{display:block;color:var(--muted);font-weight:800;font-size:14px;margin-top:4px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 12px;border-radius:10px;font:600 16px var(--f-display);color:var(--muted);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hh .seg{min-width:104px}
.hh .seg button{min-height:38px;padding:6px 10px}
.prow{display:grid;grid-template-columns:18px 48px 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.cdot{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 3px var(--surface-2)}
.ebtn{width:48px;height:48px;border-radius:14px;border:0;background:var(--surface-2);font:400 26px/1 var(--f-emoji)}
.prow input{min-width:0;width:100%;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:600 16px var(--f-body)}
.tag{font-size:12px;font-weight:800;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:4px 10px}
.tag.h{color:var(--accent-ink);background:var(--accent)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 8px;margin:0 -4px}
.chip{flex:0 0 auto;width:92px;border:0;border-radius:16px;background:var(--surface-2);padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px}
.chip[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:0}
.chip svg{width:64px;height:64px;display:block}
.chip .dice{width:56px;height:56px;border-radius:14px;padding:8px;gap:3px}
.note{color:var(--muted);font-size:14px;font-weight:600;text-align:center;margin:6px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1.5px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar>div{max-width:480px;margin:0 auto}
.btn{font:600 18px var(--f-display);padding:12px 20px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);min-height:52px;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.45}

/* Game */
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.gh .ib{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);font:600 20px var(--f-display)}
.gh b{font:600 20px var(--f-display)}
.panels{display:flex;gap:8px;padding-top:12px;margin-bottom:10px}
.pn{position:relative;flex:1;min-width:0;background:var(--surface);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 0 0 3px transparent;transition:box-shadow .2s,transform .2s}
.pn::before{content:"";position:absolute;left:10px;right:10px;top:0;height:5px;border-radius:0 0 4px 4px;background:var(--c)}
.pn.on{box-shadow:0 0 0 3px var(--c),var(--shadow);transform:translateY(-2px)}
.pe{font:400 26px/1.1 var(--f-emoji)}
.pnm{font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcnt{font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.bubble{position:absolute;right:-4px;top:-16px;font:400 30px/1 var(--f-emoji);opacity:0;transform:scale(.4);pointer-events:none}
.bubble.show{animation:pop 2.2s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.3) translateY(8px)}12%{opacity:1;transform:scale(1.25)}22%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1) translateY(-8px)}}
.boardwrap{width:min(100%,58vh,460px);margin:0 auto}
.boardwrap svg{display:block;width:100%;height:auto;border-radius:26px;box-shadow:var(--shadow)}
.pc{transition:transform .17s ease-out}
.pc .ring{display:none;fill:none;stroke:var(--gold);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:pulse .9s ease-in-out infinite}
.pc.can{cursor:pointer}
.pc.can .ring{display:block}
.pc text{font-family:var(--f-emoji);pointer-events:none}
@keyframes pulse{50%{transform:scale(1.14)}}
.ctrl{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;margin-top:14px}
.dicebox{display:flex;justify-content:center}
.dice{width:84px;height:84px;border-radius:20px;background:var(--face);box-shadow:inset 0 -5px 0 rgba(0,0,0,.14),0 8px 18px rgba(30,20,80,.25);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13px;gap:4px}
.dice i{border-radius:50%;background:transparent}
.dice i.on{background:var(--pip)}
.d-classic{--face:#FFFFFF;--pip:#2D2B4E}
.d-candy{--face:#FF8FB1;--pip:#FFFFFF}
.d-night{--face:#2A2756;--pip:#FFD54F}
.d-gold{--face:#F6C85F;--pip:#6B4210}
.dice.rolling{animation:shake .35s linear infinite}
.scene{width:96px;height:96px;perspective:380px;position:relative;display:flex;align-items:center;justify-content:center}
.dice3{width:60px;height:60px;transform-style:preserve-3d;position:relative;--tilt:rotateX(-9deg) rotateY(-12deg)}
.dice3 .cube{position:absolute;inset:0;transform-style:preserve-3d;transform:var(--tilt) rotateX(0deg) rotateY(0deg) rotateX(var(--fx)) rotateY(var(--fy));transition:transform .01s}
.dice3 .fc{position:absolute;inset:0;border-radius:12px;background:var(--face);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;gap:3px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);backface-visibility:hidden}
.dice3 .fc i{border-radius:50%}
.dice3 .fc i.on{background:var(--pip);box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.25)}
.dice3 .f1{transform:translateZ(30px);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(0,0,0,.03))}
.dice3 .f6{transform:rotateY(180deg) translateZ(30px);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(0,0,0,.03))}
.dice3 .f3{transform:rotateY(90deg) translateZ(30px);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(0,0,0,.03))}
.dice3 .f4{transform:rotateY(-90deg) translateZ(30px);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(0,0,0,.03))}
.dice3 .f2{transform:rotateX(90deg) translateZ(30px);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(0,0,0,.03))}
.dice3 .f5{transform:rotateX(-90deg) translateZ(30px);background-image:linear-gradient(160deg,rgba(255,255,255,.2),rgba(0,0,0,.03))}
.dshadow{position:absolute;left:50%;bottom:2px;width:54px;height:12px;margin-left:-27px;border-radius:50%;background:rgba(30,20,80,.28);filter:blur(2px)}
.dice3.rolling{animation:djump .5s ease-in-out infinite}
.dice3.rolling .cube{animation:dtumble .9s linear infinite}
.dice3.land .cube{animation:dland .6s cubic-bezier(.2,.7,.3,1)}
.dice3.land{animation:dbounce .6s ease-out}
@keyframes djump{0%,100%{transform:translateY(8px)}50%{transform:translateY(-14px)}}
@keyframes dbounce{0%{transform:translateY(-12px)}40%{transform:translateY(8px)}65%{transform:translateY(-4px)}100%{transform:translateY(0)}}
@keyframes dtumble{from{transform:var(--tilt) rotateX(0deg) rotateY(0deg) rotateX(0deg) rotateY(0deg)}to{transform:var(--tilt) rotateX(720deg) rotateY(1080deg) rotateX(0deg) rotateY(0deg)}}
@keyframes dland{from{transform:var(--tilt) rotateX(360deg) rotateY(540deg) rotateX(var(--fx)) rotateY(var(--fy))}to{transform:var(--tilt) rotateX(0deg) rotateY(0deg) rotateX(var(--fx)) rotateY(var(--fy))}}
@keyframes shake{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(-12deg) translateY(-6px)}50%{transform:rotate(8deg) translateY(0)}75%{transform:rotate(12deg) translateY(-4px)}100%{transform:rotate(0) translateY(0)}}
#status{margin:0 0 10px;font-weight:800;min-height:46px;display:flex;align-items:center}
.reacts{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding:2px 2px 6px}
.reacts button{flex:0 0 auto;width:48px;height:48px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);font:400 26px/1 var(--f-emoji)}
.reacts button:active{transform:scale(.92)}

.chip{position:relative}
.chip.locked{opacity:.78}
.chip.locked svg,.chip.locked .dice{filter:grayscale(.75)}
.lockb{position:absolute;top:4px;right:4px;font:400 14px/1 var(--f-emoji);background:var(--surface);border-radius:999px;padding:4px 5px;z-index:1}
.quest{padding:10px 0;border-top:1.5px solid var(--line)}
.quest:first-of-type{border-top:0}
.qh{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.qt{font-weight:800}
.qr{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.qbar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:6px 0 2px}
.qbar i{display:block;height:100%;background:var(--accent)}
.quest.done .qt,.quest.done .qr{color:var(--accent)}
.qn{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.hr{display:flex;align-items:center;gap:10px}
.mb{flex:0 0 auto;width:44px;height:44px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);font:400 22px/1 var(--f-emoji)}
.mb[aria-pressed="false"]{opacity:.6}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);max-width:min(440px,calc(100vw - 32px));
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}

.prow2{display:grid;grid-template-columns:48px 1fr;gap:10px;margin-bottom:12px}
.prow2 input,.joinrow input{min-width:0;width:100%;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:600 16px var(--f-body)}
.joinrow{display:grid;grid-template-columns:1fr 130px;gap:10px;margin-top:12px}
.joinrow input{text-transform:uppercase;letter-spacing:.3em;text-align:center;font:600 22px var(--f-display)}
.joinrow .btn{min-height:48px}
.code{font:600 58px/1.1 var(--f-display);letter-spacing:.2em;margin:6px 0 10px;padding-left:.2em}
.lrow{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;background:var(--surface-2);margin-bottom:8px}
.lrow .pe{font:400 28px/1 var(--f-emoji)}
.lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.speak,.pn.speak{outline:3px solid #34C759;outline-offset:-1px}
.mini{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface);color:var(--ink);font-size:16px}
.step{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.step .lbl{font-weight:800}
.step button{width:44px;height:44px;border-radius:14px;border:0;background:var(--surface-2);font:600 24px var(--f-display);color:var(--ink)}
.step button:disabled{opacity:.4}
.step .cnt{font:600 22px var(--f-display);min-width:20px;text-align:center}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.fig{transform-box:fill-box;transform-origin:50% 60%}
.pc.fly{transition:transform .7s cubic-bezier(.25,.6,.3,1) .45s}
.fig.hit{animation:tumble .7s .45s both}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}45%{transform:translateY(-38px) rotate(300deg)}100%{transform:translateY(0) rotate(720deg)}}
.fig.hop{animation:hop .24s ease-out}
@keyframes hop{50%{transform:translateY(-7px)}}
.pc.can .fig{animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.fig.kick{animation:lunge .6s .15s}
@keyframes lunge{40%{transform:translateX(calc(var(--d,1)*3px))}}
.fig.kick .legK{animation:kick .6s .15s ease-in-out}
@keyframes kick{0%{transform:rotate(0)}30%{transform:rotate(calc(var(--d,1)*30deg))}55%{transform:rotate(calc(var(--d,1)*-85deg))}100%{transform:rotate(0)}}
.door{transition:transform .35s ease-out}
.door.open{transform:rotate(-100deg)}

.wleg{margin:6px auto 0;max-width:460px;font-size:11px;line-height:1.35;text-align:center;color:var(--muted,#9a96c4)}

.oh{transform-box:fill-box;transform-origin:50% 100%;animation:ohpop 1.8s ease-out forwards;pointer-events:none}
@keyframes ohpop{0%{opacity:0;transform:scale(.3)}10%{opacity:1;transform:scale(1.18)}20%{transform:scale(1)}78%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-8px)}}

.pc .big{transform:translate(0,-8px) scale(1.62);transition:transform .3s}
.pc[data-s="-1"] .big{transform:translate(0,-4px) scale(1.12)}

.fig .limb{transform-box:fill-box}
.fig .legA,.fig .legB{transform-origin:50% 0}
.fig .armA,.fig .armB{transform-origin:50% 0}
.fig.walk{animation:wbob .19s ease-in-out infinite}
@keyframes wbob{50%{transform:translateY(-3px) rotate(2deg)}}
.fig.stA .legA{animation:lfw .19s ease-in-out}.fig.stA .legB{animation:lbk .19s ease-in-out}
.fig.stB .legB{animation:lfw .19s ease-in-out}.fig.stB .legA{animation:lbk .19s ease-in-out}
.fig.stA .armB,.fig.stB .armA{animation:lfw .19s ease-in-out}.fig.stA .armA,.fig.stB .armB{animation:lbk .19s ease-in-out}
@keyframes lfw{0%{transform:rotate(-28deg)}100%{transform:rotate(26deg)}}
@keyframes lbk{0%{transform:rotate(26deg)}100%{transform:rotate(-28deg)}}
.pc .big{filter:drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 1.2px #fff)}
.fig .hat{transform-box:fill-box;transform-origin:45% 95%;animation:wind 1.9s ease-in-out infinite}
@keyframes wind{0%,100%{transform:rotate(-14deg) skewX(-14deg)}30%{transform:rotate(26deg) skewX(20deg)}55%{transform:rotate(8deg) skewX(6deg)}80%{transform:rotate(32deg) skewX(24deg)}}
.ws{opacity:0;animation:gust 3.6s linear infinite}
@keyframes gust{0%{transform:translateX(-200px);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateX(520px);opacity:0}}
.tr{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
.lf{animation:leaf 4.6s linear infinite}
@keyframes leaf{0%{transform:translate(-30px,var(--y,0)) rotate(0);opacity:0}10%{opacity:1}50%{transform:translate(240px,calc(var(--y,0) + 30px)) rotate(360deg)}90%{opacity:1}100%{transform:translate(500px,calc(var(--y,0) - 10px)) rotate(720deg);opacity:0}}
.vsec{margin-top:14px}
.vsec>b{display:block;margin-bottom:6px}
.vsec .btn{margin-top:8px;width:100%}
.vdev{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vdev .chip{flex:0 1 auto;font-size:14px;padding:8px 12px;min-height:40px}
.vpl{display:flex;align-items:center;gap:8px;margin-top:6px}
.vpn{flex:0 0 38%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.vpl input[type=range]{flex:1;min-width:0}
#vvol{width:100%}

/* Sheets */
.overlay{position:fixed;inset:0;background:rgba(15,12,40,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;max-height:82vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.egrid button{height:54px;border-radius:14px;border:0;background:var(--surface-2);font:400 28px/1 var(--f-emoji)}
.egrid button:disabled{opacity:.3}
.egrid button.on{outline:3px solid var(--accent)}
.win{text-align:center}
.win .big{font:400 72px/1.2 var(--f-emoji)}
.win h2{font-size:24px}
.sheet .row2{display:flex;gap:10px;margin-top:14px}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="overlay" data-act="close" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};

/*LOGIC-START*/
/* Bahn: 40 Felder, Startfeld von Farbe c liegt bei Index c*10. Figur-Stand s: -1 = Haus, 0..39 = Schritte ab Start, 40..43 = Zielfelder. */
var TRACK=[[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[4,0],[5,0],[6,0],[6,1],[6,2],[6,3],[6,4],[7,4],[8,4],[9,4],[10,4],[10,5],
  [10,6],[9,6],[8,6],[7,6],[6,6],[6,7],[6,8],[6,9],[6,10],[5,10],[4,10],[4,9],[4,8],[4,7],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5]];
var HOME=[[[1,5],[2,5],[3,5],[4,5]],[[5,1],[5,2],[5,3],[5,4]],[[9,5],[8,5],[7,5],[6,5]],[[5,9],[5,8],[5,7],[5,6]]];
var BASES=[[[0,0],[1,0],[0,1],[1,1]],[[9,0],[10,0],[9,1],[10,1]],[[9,9],[10,9],[9,10],[10,10]],[[0,9],[1,9],[0,10],[1,10]]];
var SEATS={2:[0,2],3:[0,1,2],4:[0,1,2,3]};
function tIdx(c,s){return (c*10+s)%40}
function cellOf(c,s,pi){if(s<0)return BASES[c][pi];if(s<40)return TRACK[tIdx(c,s)];return HOME[c][s-40]}
function legalMoves(pieces,r,c,blk){
  var out=[],base=0,startOcc=false;
  pieces.forEach(function(s){if(s===-1)base++;if(s===0)startOcc=true});
  pieces.forEach(function(s,pi){
    var to;
    if(s===-1){if(r!==6)return;to=0}else{to=s+r;if(to>43)return}
    for(var oi=0;oi<pieces.length;oi++){if(oi!==pi&&pieces[oi]===to)return}
    if(blk&&to<40&&blk.indexOf(tIdx(c,to))>=0)return;
    out.push({pi:pi,to:to});
  });
  if(r===6&&base>0&&!startOcc){
    var outs=out.filter(function(m){return pieces[m.pi]===-1});
    if(outs.length)return outs;
  }
  if(base>0&&startOcc){
    var mv=out.filter(function(m){return pieces[m.pi]===0});
    if(mv.length)return mv;
  }
  return out;
}
/* Sonderfelder (nur Brett "Knallwald"): Feld k = Schritt s%10. 2 Rückenwind +3, 4 Glücksblume (nochmal würfeln),
   5 Pilzschutz (nur eine Figur, niemand sonst darf darauf), 7 Portal +10 (bis Schritt 27), 8 Gegenwind -3. */
function fieldFx(s){
  var k=s%10;
  if(s<0||s>39)return null;
  if(k===2)return {t:'boost',d:3};
  if(k===8)return {t:'back',d:-3};
  if(k===7&&s<=27)return {t:'portal',d:10};
  if(k===4)return {t:'flower'};
  return null;
}
function pilzBlocked(players,me){
  var out=[];
  players.forEach(function(o){
    if(o===me)return;
    o.pieces.forEach(function(s){if(s>=0&&s<40&&s%10===5)out.push(tIdx(o.c,s))});
  });
  return out;
}
function fxPlan(players,me,mp,to){
  var f=fieldFx(to);
  if(!f)return null;
  if(f.t==='flower')return {t:'flower'};
  var tgt=to+f.d,i;
  for(i=0;i<me.pieces.length;i++){if(i!==mp&&me.pieces[i]===tgt)return null}
  if(pilzBlocked(players,me).indexOf(tIdx(me.c,tgt))>=0)return null;
  return {t:f.t,pi:mp,to:tgt};
}
function danger(players,me,gi){
  var n=0;
  players.forEach(function(o){
    if(o===me)return;
    o.pieces.forEach(function(s){
      if(s<0||s>=40)return;
      var d=(gi-tIdx(o.c,s)+40)%40;
      if(d>=1&&d<=6)n++;
    });
  });
  return n;
}
function aiScore(players,me,m){
  var from=me.pieces[m.pi],to=m.to,sc=Math.random()*4;
  if(to>=40){sc+=45+to}
  else{
    var gi=tIdx(me.c,to);
    players.forEach(function(o){
      if(o===me)return;
      o.pieces.forEach(function(s){if(s>=0&&s<40&&tIdx(o.c,s)===gi)sc+=100+s});
    });
    sc-=danger(players,me,gi)*14;
    sc+=to*0.4;
  }
  if(from===-1)sc+=55;
  if(from>=0&&from<40){
    var cg=tIdx(me.c,from);
    if(danger(players,me,cg)>0)sc+=18;
  }
  return sc;
}

function genCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ',s='';for(var i=0;i<4;i++)s+=a.charAt(Math.floor(Math.random()*a.length));return s}
function ensureAuth(){
  var f=window.firebase;
  if(!f||!f.auth)return Promise.resolve();
  getDb();
  return f.auth().signInAnonymously().then(function(c){
    var u=c&&c.user&&c.user.uid;
    if(u&&ME.cid!==u){ME.cid=u;saveMe()}
  });
}
function createRoom(){
  if(!onlineReady())return;
  var d,code=genCode(),n=0;
  try{d=getDb()}catch(e){toast(t('netErr'));return}
  ensureAuth().then(function(){
    (function attempt(){
      d.ref('rooms/'+code+'/host').once('value').then(function(s){
        if(s.exists()&&n++<6){code=genCode();return attempt()}
        return d.ref('rooms/'+code).set({host:ME.cid,created:Date.now(),settings:{board:S.board,dice:S.dice,bots:0}}).then(function(){enterRoom(code)});
      }).catch(function(){toast(t('netErr'))});

  }).catch(function(){toast(t('netErr'))});
}
function joinRoom(){
  if(!onlineReady())return;
  var el=$('#joincode'),code=el?el.value.toUpperCase().replace(/[^A-Z]/g,''):'';
  if(code.length!==4){toast(t('roomNotFound'));return}
  var d;try{d=getDb()}catch(e){toast(t('netErr'));return}
  var base='rooms/'+code;
  ensureAuth().then(function(){
    return Promise.all([d.ref(base+'/host').once('value'),d.ref(base+'/lobby/players').once('value'),d.ref(base+'/state/players').once('value')]);
  }).then(function(rs){
    if(!rs[0].exists()){toast(t('roomNotFound'));return}
    var sp=rs[2].val();
    if(sp){
      var list=Array.isArray(sp)?sp:Object.keys(sp).map(function(k){return sp[k]});
      var mine=list.some(function(p){return p&&p.cid===ME.cid});
      if(!mine){toast(t('gameRunning'));return}
    }else if(Object.keys(rs[1].val()||{}).filter(function(k){return k!==ME.cid}).length>=4){toast(t('roomFull'));return}
    enterRoom(code);

/* ---------- Spiel-Engine: gleiche Logik lokal und online ---------- */
function norm(s){
  s=JSON.parse(JSON.stringify(s));
  var arr=function(x){return Array.isArray(x)?x:(x?Object.keys(x).map(function(k){return x[k]}):[])};
  s.players=arr(s.players).map(function(p){p.pieces=arr(p.pieces);p.tries=p.tries||0;return p});
  s.moves=arr(s.moves);
  s.roll=s.roll||0;s.rv=s.rv||0;s.note=s.note||'';s.turn=s.turn||0;
  s.fx=s.fx||null;s.wk=s.wk||0;s.kicked=s.kicked==null?null:s.kicked;s.winner=s.winner==null?null:s.winner;
  return s;
}
function onState(raw){
  var s=norm(raw);
  if(ST&&ST.gid===s.gid&&s.v<ST.v)return;
  var fresh=!ST||ST.gid!==s.gid;
  ST=s;lastChange=Date.now();
  if(fresh)closeSheet();
  renderGame();schedule();
}
function commit(patch){
  var n=Object.assign({},ST,patch,{v:(ST.v||0)+1});
  ST=norm(n);
  if(MODE==='online')REF.child('state').set(JSON.parse(JSON.stringify(n)));
  else onState(n);
}
function copyPlayers(){return ST.players.map(function(p){return Object.assign({},p,{pieces:p.pieces.slice()})})}
function actorIsMe(p){return MODE==='local'||(p.human?p.cid===ME.cid:isHost())}
function isMyHuman(p){return p.human&&(MODE==='local'||p.cid===ME.cid)}
function takeover(p){return MODE==='online'&&isHost()&&p.human&&p.cid!==ME.cid&&!PRES[p.cid]&&Date.now()-lastChange>12000}
function schedule(){
  clearTimeout(tmr);tmr=null;
  if(!ST||ST.phase==='over')return;
  var p=ST.players[ST.turn],mine=actorIsMe(p);
  if(!mine&&!takeover(p))return;
  var bot=!p.human||!mine;
  var go=function(fn,ms){var v=ST.v,g=ST.gid;tmr=setTimeout(function(){tmr=null;if(ST&&ST.v===v&&ST.gid===g)fn()},ms)};
  switch(ST.phase){
    case 'roll':if(bot)go(doRoll,900);break;
    case 'rolling':go(finishRoll,600);break;
    case 'rolled':
      if(ST.moves.length===0)go(noMove,1100);
      else if(bot)go(botMove,800);
      break;
    case 'moved':
      if(ST.fx&&ST.fx.to!=null&&!ST.fx.done)go(applyFx,1000+(ST.wk||0)*WSTEP);
      else go(afterMove,(ST.kicked!=null||(ST.fx&&ST.fx.done)?1300:(ST.fx?1100:500))+(ST.fx&&ST.fx.done?0:(ST.wk||0)*WSTEP));
      break;
  }
}
function doRoll(){
  if(!ST||ST.phase!=='roll')return;
  commit({phase:'rolling',rv:ST.rv+1,roll:0,moves:[],kicked:null});
}
function finishRoll(){
  var p=ST.players[ST.turn],r=1+Math.floor(Math.random()*6);
  var mv=legalMoves(p.pieces,r,p.c,ST.board==='wald'?pilzBlocked(ST.players,p):null);
  if(isMyHuman(p)&&r===6)bump('sixes',1);
  if(!p.human&&r===6&&Math.random()<0.2)sendReact(ST.turn,pick(['😎','🔥','💪']));
  commit({phase:'rolled',roll:r,moves:mv});
}
function noMove(){
  var p=ST.players[ST.turn];
  var onlyBase=p.pieces.some(function(s){return s===-1})&&p.pieces.every(function(s){return s===-1||s>=40});
  if(onlyBase&&(p.tries||0)+1<3){
    var pls=copyPlayers();pls[ST.turn].tries=(p.tries||0)+1;
    commit({players:pls,phase:'roll',note:'tries',moves:[]});
    return;
  }
  nextTurn(false);
}
function botMove(){
  var p=ST.players[ST.turn],best=null,bs=-1e9;
  ST.moves.forEach(function(m){var sc=aiScore(ST.players,p,m);if(sc>bs){bs=sc;best=m}});
  if(best)doMove(best);
}
function doMove(m){
  if(!ST||ST.phase!=='rolled')return;
  var pi=ST.turn,pls=copyPlayers(),p=pls[pi],from=p.pieces[m.pi],kicked=null;
  p.pieces[m.pi]=m.to;
  if(m.to<40){
    var gi=tIdx(p.c,m.to);
    pls.forEach(function(o,oi){
      if(oi===pi)return;
      o.pieces=o.pieces.map(function(s){if(s>=0&&s<40&&tIdx(o.c,s)===gi){kicked=oi;return -1}return s});
    });
  }
  var won=p.pieces.every(function(s){return s>=40});
  var fx=(!won&&ST.board==='wald'&&m.to<40)?fxPlan(pls,p,m.pi,m.to):null;
  if(isMyHuman(p)){if(kicked!=null)bump('kicks',1);if(from<40&&m.to>=40)bump('goals',1)}
  commit({players:pls,phase:won?'over':'moved',kicked:kicked,winner:won?pi:null,moves:[],fx:fx,wk:from<0?1:Math.abs(m.to-from)});
  if(kicked!=null){
    if(!pls[kicked].human)sendReact(kicked,pick(['😡','😭','😱','🙈']));
    if(!p.human&&Math.random()<0.7)setTimeout(function(){sendReact(pi,pick(['😂','😎','🙈','💪']))},350);
  }
  if(won){
    pls.forEach(function(o,oi){if(oi!==pi&&!o.human&&Math.random()<0.6)sendReact(oi,pick(['😭','👏','🙈']))});
    sendReact(pi,'🎉');
  }
}
function applyFx(){
  var fx=ST.fx;
  if(!ST||ST.phase!=='moved'||!fx||fx.to==null||fx.done)return;
  var pi=ST.turn,pls=copyPlayers(),p=pls[pi],kicked=null;
  p.pieces[fx.pi]=fx.to;
  var gi=tIdx(p.c,fx.to);
  pls.forEach(function(o,oi){
    if(oi===pi)return;
    o.pieces=o.pieces.map(function(s){if(s>=0&&s<40&&tIdx(o.c,s)===gi){kicked=oi;return -1}return s});
  });
  if(isMyHuman(p)&&kicked!=null)bump('kicks',1);
  commit({players:pls,kicked:kicked!=null?kicked:ST.kicked,fx:{t:fx.t,pi:fx.pi,to:fx.to,done:true}});
  if(kicked!=null&&!pls[kicked].human)sendReact(kicked,pick(['😡','😭','😱','🙈']));
}
function afterMove(){
  var flower=!!(ST.fx&&ST.fx.t==='flower');
  nextTurn(ST.roll===6||flower,flower&&ST.roll!==6?'flower':'');
}
function nextTurn(extra,note){
  var pls=copyPlayers(),nt=extra?ST.turn:(ST.turn+1)%pls.length;
  pls[nt].tries=0;
  commit({players:pls,turn:nt,phase:'roll',note:extra?(note||'again'):'',moves:[],kicked:null,fx:null});
}

function statusText(){
  var cp=ST.players[ST.turn],n=cp.name;
  switch(ST.phase){
    case 'roll':
      if(ST.note==='again')return t('again');
      if(ST.note==='flower')return t('againFlower');
      if(ST.note==='tries')return t('noMove')+' '+t('tries',{k:3-(cp.tries||0)});
      return t('turn',{n:n});
    case 'rolling':return t('turn',{n:n});
    case 'rolled':{
      var s=t('rolled',{n:n,r:ST.roll});
      if(!ST.moves.length)return s+' '+t('noMove');
      if(cp.human&&actorIsMe(cp))return s+' '+(ST.moves.length===1?t('only'):t('choose'));
      return s}
    case 'moved':
      if(ST.kicked!=null&&(!ST.fx||ST.fx.done||ST.fx.to==null))return t('kick',{a:n,b:ST.players[ST.kicked].name});
      if(ST.fx&&ST.fx.t==='boost')return t('fxBoost');
      if(ST.fx&&ST.fx.t==='back')return t('fxBack');
      if(ST.fx&&ST.fx.t==='portal')return t('fxPortal');
      if(ST.fx&&ST.fx.t==='flower')return t('fxFlower');
      return t('rolled',{n:n,r:ST.roll});

}

  document.querySelectorAll('.vb').forEach(function(b){
    b.setAttribute('aria-pressed',String(!!V.track&&!V.muted&&!V.err));
    b.setAttribute('aria-label',t(V.track&&!V.muted?'voiceOn':'voiceOff'));
    b.textContent=V.err?'🚫':!V.track?'🎧':V.muted?'🤫':'🎙️';
  });
}
function iceCfg(){
  return {iceServers:(CFG.iceServers&&CFG.iceServers.length)?CFG.iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
}
function actx(){
  if(!AUDIO_CTX){var A=window.AudioContext||window.webkitAudioContext;if(A)AUDIO_CTX=new A()}
  if(AUDIO_CTX&&AUDIO_CTX.state==='suspended'){try{AUDIO_CTX.resume()}catch(e){}}
  return AUDIO_CTX;
}
function watchLevel(stream,vuid){
  try{
    var c=actx();if(!c||!vuid)return null;
    var src=c.createMediaStreamSource(stream),an=c.createAnalyser();an.fftSize=512;src.connect(an);
    var buf=new Uint8Array(an.fftSize);
    return setInterval(function(){
      an.getByteTimeDomainData(buf);
      var s=0;for(var i=0;i<buf.length;i++){var d=(buf[i]-128)/128;s+=d*d}
      var now=Math.sqrt(s/buf.length)>0.04&&!(vuid===ME.vuid&&V.muted),was=!!V.speaking[vuid];
      if(now!==was){if(now)V.speaking[vuid]=1;else delete V.speaking[vuid];markSpeaking()}
    },200);
  }catch(e){return null}
}
function sendSig(to,type,data){
  if(!REF)return;
  REF.child('sig/'+to).push({from:ME.cid,type:type,data:JSON.stringify(data),t:Date.now()});
}
function closePeer(cid){
  var p=VP[cid];if(!p)return;
  delete VP[cid];
  try{p.pc.close()}catch(e){}
  if(p.audio){try{p.audio.srcObject=null;p.audio.remove()}catch(e){}}
  if(p.lvl)clearInterval(p.lvl);
  try{if(p.gn)p.gn.disconnect();if(p.node)p.node.disconnect()}catch(e){}
  if(p.vuid)delete V.speaking[p.vuid];
}
function makePeer(cid,inf,init){
  var pc=new window.RTCPeerConnection(iceCfg());
  var p={pc:pc,t:inf?inf.t:undefined,vuid:inf?inf.vuid:0,queue:[],ready:false,audio:null,lvl:null};
  VP[cid]=p;
  pc.onicecandidate=function(e){if(e.candidate)sendSig(cid,'ice',e.candidate.toJSON?e.candidate.toJSON():e.candidate)};
  pc.ontrack=function(e){
    var st=e.streams&&e.streams[0];
    if(!st)return;
    if(!p.audio){
      var a=document.createElement('audio');a.autoplay=true;a.setAttribute('playsinline','');
      document.body.appendChild(a);p.audio=a;
    }
    p.audio.srcObject=st;p.stream=st;
    applyRoute(p);applyOut();
    try{var pr=p.audio.play();if(pr&&pr.catch)pr.catch(function(){})}catch(err){}
    if(!p.lvl)p.lvl=watchLevel(st,p.vuid);
  };
  pc.onconnectionstatechange=function(){
    if(pc.connectionState==='failed'&&VP[cid]===p){closePeer(cid);setTimeout(syncPeers,2500)}
  };
  if(V.track)pc.addTrack(V.track,V.stream);
  else if(init)pc.addTransceiver('audio',{direction:'recvonly'});
  if(init){
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){
      sendSig(cid,'offer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp});
    }).catch(function(){});
  }
  return p;
}
function flushIce(p){p.queue.forEach(function(c){p.pc.addIceCandidate(c).catch(function(){})});p.queue=[]}
function syncPeers(){
  if(!V.on)return;
  var info=V.peersInfo||{};
  Object.keys(VP).forEach(function(cid){
    var p=VP[cid];
    if(!info[cid]){closePeer(cid);return}
    if(p.t===undefined){p.t=info[cid].t;p.vuid=info[cid].vuid;return}
    if(p.t!==info[cid].t)closePeer(cid);
  });
  Object.keys(info).forEach(function(cid){
    if(cid===ME.cid||VP[cid])return;
    if(ME.cid<cid)makePeer(cid,info[cid],true);
  });
}
function onSignal(s){
  var m=s.val();
  try{REF.child('sig/'+ME.cid+'/'+s.key).remove()}catch(e){}
  if(!m||!V.on)return;
  var cid=m.from,data;
  try{data=JSON.parse(m.data)}catch(e){return}
  if(m.type==='offer'){
    if(VP[cid])closePeer(cid);
    var p=makePeer(cid,V.peersInfo&&V.peersInfo[cid],false),pc=p.pc;
    pc.setRemoteDescription(data).then(function(){p.ready=true;flushIce(p);return pc.createAnswer()})
      .then(function(a){return pc.setLocalDescription(a)})
      .then(function(){sendSig(cid,'answer',{type:pc.localDescription.type,sdp:pc.localDescription.sdp})})
      .catch(function(){});
  }else if(m.type==='answer'){
    var q=VP[cid];if(!q)return;
    q.pc.setRemoteDescription(data).then(function(){q.ready=true;flushIce(q)}).catch(function(){});
  }else if(m.type==='ice'){
    var r=VP[cid];if(!r)return;
    if(r.ready)r.pc.addIceCandidate(data).catch(function(){});else r.queue.push(data);
  }
}
function voiceJoin(){
  if(!voiceReady()||V.on||!REF)return;
  V.on=true;V.err=false;
  var go=function(stream){
    if(!V.on)return;
    V.stream=stream||null;V.track=null;
    if(stream){
      V.track=stream.getAudioTracks()[0]||null;
      if(V.track)V.track.enabled=!V.muted;
      V.lvl=watchLevel(stream,ME.vuid);
    }
    V.t=Date.now();
    var me=REF.child('voice/'+ME.cid);V.mine=me;
    var inbox=REF.child('sig/'+ME.cid);
    inbox.remove();
    inbox.on('child_added',onSignal);V.refs.push(inbox);
    var vr=REF.child('voice');
    vr.on('value',function(s){V.peersInfo=s.val()||{};syncPeers()});V.refs.push(vr);
    var c=getDb().ref('.info/connected');
    c.on('value',function(s){if(s.val()){me.set({vuid:ME.vuid,t:V.t});me.onDisconnect().remove()}});V.refs.push(c);
    updVoiceBtn();
  };
  var fail=function(){V.err=true;updVoiceBtn();toast(t('micDenied'));go(null)};
  if(S.mic!==true){
    go(null);
    if(!V.hint){V.hint=true;toast(t('micHint'))}
    return;
  }
  var base={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  var get=function(dev){
    var a=base;
    if(dev){a={echoCancellation:true,noiseSuppression:true,autoGainControl:true,deviceId:{exact:dev}}}
    return navigator.mediaDevices.getUserMedia({audio:a});
  };
  get(S.micDev||'').then(go,function(){
    if(S.micDev){S.micDev='';save();get('').then(go,fail)}else fail();
  });
}
function voiceLeave(){
  V.on=false;
  Object.keys(VP).forEach(closePeer);
  V.refs.forEach(function(r){try{r.off()}catch(e){}});V.refs=[];
  try{if(V.mine)V.mine.remove()}catch(e){}
  if(V.lvl)clearInterval(V.lvl);
  try{if(V.stream)V.stream.getTracks().forEach(function(tr){tr.stop()})}catch(e){}
  V.stream=null;V.track=null;V.mine=null;V.lvl=null;V.err=false;V.muted=false;V.speaking={};V.peersInfo={};
}
function voiceRestart(){var c=ROOM.code;voiceLeave();if(c)voiceJoin();updVoiceBtn()}
function voiceToggle(){
  if(V.err||!V.track){S.mic=true;save();voiceRestart();return}
  V.muted=!V.muted;V.track.enabled=!V.muted;updVoiceBtn();
}
function voiceMenu(){
  var h='<h2>'+t('vmTitle')+'</h2>';
  h+='<div class="vsec"><b>'+t('vmMic')+'</b><div class="seg" role="group"><button data-act="vmic" data-v="1" aria-pressed="'+(!!V.track)+'">'+t('vmMicOn')+'</button><button data-act="vmic" data-v="0" aria-pressed="'+(!V.track)+'">'+t('vmMicOff')+'</button></div>';
  if(V.track)h+='<button class="btn ghost" data-act="vmute">'+(V.muted?'🤫 '+t('voiceOff'):'🎙️ '+t('voiceOn'))+'</button>';
  h+='<div id="vdevin" class="vdev"></div></div>';
  h+='<div class="vsec"><b>'+t('vmOut')+'</b><div class="seg" role="group"><button data-act="vroute" data-v="web" aria-pressed="'+(V.route==='web')+'">🔊 '+t('vmSpk')+'</button><button data-act="vroute" data-v="el" aria-pressed="'+(V.route!=='web')+'">📞 '+t('vmEar')+'</button></div><div id="vdevout" class="vdev"></div></div>';
  h+='<div class="vsec"><b>'+t('vmVol')+'</b><input type="range" id="vvol" min="0" max="100" value="'+Math.round(vvol()*100)+'" aria-label="'+t('vmVol')+'"></div>';
  var others=(ST&&ST.players||[]).filter(function(p){return p.human&&p.vuid&&p.vuid!==ME.vuid});
  if(others.length){
    h+='<div class="vsec"><b>'+t('vmPlayers')+'</b>'+others.map(function(p){
      var q=pvOf(p.vuid);
      return '<div class="vpl"><span class="vpn">'+esc(p.emoji||'🙂')+' '+esc(p.name||'?')+'</span><input type="range" min="0" max="150" value="'+Math.round(q.v*100)+'" data-pv="'+p.vuid+'" aria-label="'+esc(p.name||'?')+'"><button class="mb" data-act="vpm" data-u="'+p.vuid+'" aria-pressed="'+(!q.m)+'" aria-label="'+esc(p.name||'?')+'">'+(q.m?'🔇':'🔊')+'</button></div>';
    }).join('')+'</div>';
  }
  h+='<div class="row2"><button class="btn" data-act="close">'+t('vmDone')+'</button></div>';
  openSheet(h);
  fillDevs();
}
function fillDevs(){
  var md=navigator.mediaDevices;
  if(!md||!md.enumerateDevices)return;
  md.enumerateDevices().then(function(list){
    var ins=list.filter(function(d){return d.kind==='audioinput'}),outs=list.filter(function(d){return d.kind==='audiooutput'});
    var ei=$('#vdevin'),eo=$('#vdevout');
    function btn(act,id,label,on){return '<button class="chip" data-act="'+act+'" data-v="'+esc(id)+'" aria-pressed="'+on+'">'+esc(label)+'</button>'}
    if(ei){
      ei.innerHTML=V.track&&ins.length?btn('vin','',t('vmDefault'),!S.micDev)+ins.map(function(d,i){
        return d.deviceId&&d.deviceId!=='default'&&d.deviceId!=='communications'?btn('vin',d.deviceId,d.label||(t('vmMic')+' '+(i+1)),S.micDev===d.deviceId):'';
      }).join(''):'';
    }
    if(eo){
      var o=outs.filter(function(d){return d.deviceId&&d.deviceId!=='default'&&d.deviceId!=='communications'});
      eo.innerHTML=o.length?btn('vout2','',t('vmDefault'),!S.outDev)+o.map(function(d,i){return btn('vout2',d.deviceId,d.label||(t('vmOut')+' '+(i+1)),S.outDev===d.deviceId)}).join(''):'<p class="sub" style="margin:6px 0 0">'+t('vmOutHint')+'</p>';
    }
  }).catch(function(){});
}
setInterval(function(){if(MODE==='online'&&ST&&isHost()&&!tmr)schedule()},3000);

/* ---------- Sheets ---------- */
function openSheet(h){$('#sheet').innerHTML=h;$('#overlay').hidden=false;var b=$('#sheet button:not(:disabled)');if(b)b.focus()}
function closeSheet(){$('#overlay').hidden=true}
function emojiSheet(c){
  var used,cur;
  if(c==='me'){used=Object.keys(LOB).filter(function(k){return k!==ME.cid}).map(function(k){return LOB[k].emoji});cur=ME.emoji}
  else{used=SEATS[S.count].filter(function(x){return x!==+c}).map(function(x){return S.emojis[x]});cur=S.emojis[+c]}
  openSheet('<h2>'+t('chooseEmoji')+'</h2><div class="egrid">'+EMOJIS.map(function(e){
    return '<button data-act="pick" data-c="'+c+'" data-e="'+e+'"'+(used.indexOf(e)>=0?' disabled':'')+(cur===e?' class="on"':'')+'>'+e+'</button>';
  }).join('')+'</div>');
}

/* ---------- Ereignisse ---------- */
function inRoom(){return MODE==='online'&&!!REF}
function handle(t0){
  var a=t0.dataset.act,v=t0.dataset.v;
  switch(a){
    case 'lang':S.lang=v;save();home();break;
    case 'count':S.count=+v;if(S.humans>S.count)S.humans=S.count;save();home();break;
    case 'humans':S.humans=+v;save();home();break;
    case 'board':
      S.board=v;save();
      if(inRoom()){if(isHost())REF.child('settings/board').set(v)}else home();
      break;
    case 'dice':
      S.dice=v;save();
      if(inRoom()){if(isHost())REF.child('settings/dice').set(v)}else home();
      break;
    case 'locked':{var q=questFor(t0.dataset.kind,v);if(q)toast(t('lockedMsg',{q:questText(q)}));break}
    case 'emoji':emojiSheet(t0.dataset.c);break;
    case 'pick':{
      var c=t0.dataset.c,e=t0.dataset.e;
      if(c==='me'){ME.emoji=e;saveMe();if(inRoom())REF.child('lobby/players/'+ME.cid+'/emoji').set(e)}
      else{S.emojis[+c]=e;save()}
      closeSheet();
      if(inRoom())renderRoom();else home();
      break}
    case 'music':toggleSfx();break;
    case 'voice':voiceToggle();break;
    case 'vout':voiceRoute();break;
    case 'vmenu':voiceMenu();break;
    case 'vmic':S.mic=(v==='1');save();voiceRestart();setTimeout(voiceMenu,900);break;
    case 'vmute':voiceToggle();voiceMenu();break;
    case 'vroute':if((V.route==='web')!==(v==='web'))voiceRoute();voiceMenu();break;
    case 'vin':S.micDev=v;save();voiceRestart();setTimeout(voiceMenu,900);break;
    case 'vout2':S.outDev=v;save();applyOut();voiceMenu();break;
    case 'vpm':{var q=pvOf(+t0.dataset.u);q.m=!q.m;applyAll();voiceMenu();break}
    case 'start':startLocal();break;
    case 'create':createRoom();break;
    case 'join':joinRoom();break;
    case 'bots':{
      if(!inRoom()||!isHost())break;
      var nb=Math.max(0,(SET.bots||0)+(+t0.dataset.d)),hum=Object.keys(LOB).length;
      if(hum+nb>4)nb=4-hum;
      REF.child('settings/bots').set(nb);break}
    case 'startroom':startRoom();break;
    case 'invite':{
      var link=roomLink(),txt=t('inviteText',{c:ROOM.code,u:link});
      var w=null;try{w=window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank')}catch(err){}
      if(!w)copyText(link);
      break}
    case 'copylink':copyText(roomLink());break;
    case 'roll':
      if(ST&&ST.phase==='roll'){var rp=ST.players[ST.turn];if(rp.human&&actorIsMe(rp))doRoll()}
      break;
    case 'react':{
      var si=mySeat();
      if(si>=0)sendReact(si,t0.dataset.e);
      break}
    case 'leave':
      if(MODE==='online'&&!ST){leaveRoom();break}
      openSheet('<h2>'+t('leave')+'</h2><p class="sub" style="margin:0">'+t('leaveSub')+'</p><div class="row2"><button class="btn ghost" data-act="close">'+t('stay')+'</button><button class="btn" data-act="menu">'+t('leaveBtn')+'</button></div>');
      break;
    case 'menu':
      closeSheet();
      if(MODE==='online')leaveRoom();else{home();window.scrollTo(0,0)}
      break;
    case 'replay':closeSheet();startLocal();break;
    case 'newround':
      closeSheet();
      if(inRoom()&&isHost())REF.child('state').remove();
      break;
    case 'close':closeSheet();break;
  }
}
function roomLink(){
  var l=window.location||{};
  return String(l.origin||'')+String(l.pathname||'')+'#'+ROOM.code;
}
function copyText(txt){
  try{
    navigator.clipboard.writeText(txt).then(function(){toast(t('linkCopied'))},function(){toast(txt)});
  }catch(err){toast(txt)}
}
document.addEventListener('click',function(e){
  if(AUDIO_CTX&&AUDIO_CTX.state==='suspended'){try{AUDIO_CTX.resume()}catch(err){}}
  var pcEl=e.target.closest('.pc');
  if(pcEl){
    if(ST&&ST.phase==='rolled'){
      var p=ST.players[ST.turn];
      if(p.human&&actorIsMe(p)&&pcEl.classList.contains('can')&&+pcEl.dataset.c===p.c){
        var m=ST.moves.filter(function(x){return x.pi===+pcEl.dataset.pi})[0];
        if(m)doMove(m);
      }
    }
    return;
  }
  var el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  if(el.id==='overlay'&&e.target!==el)return;
  handle(el);
});
document.addEventListener('input',function(e){
  var el=e.target,n=el.dataset&&el.dataset.name;
  if(n!==undefined){S.names[+n]=el.value;save();return}
  if(el.id==='myname'){ME.name=el.value;saveMe();return}
  if(el.id==='vvol'){S.vol=(+el.value)/100;save();applyAll();return}
  if(el.dataset&&el.dataset.pv){pvOf(+el.dataset.pv).v=(+el.value)/100;applyAll();return}
  if(el.id==='joincode'){var v=el.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);if(v!==el.value)el.value=v}
});

(function(){
  var lp=null;
  document.addEventListener('pointerdown',function(e){
    var b=e.target.closest&&e.target.closest('.vb');if(!b)return;
    clearTimeout(lp);lp=setTimeout(function(){V.lpDone=true;voiceMenu()},600);
  });
  ['pointerup','pointercancel','pointerleave','scroll'].forEach(function(n){document.addEventListener(n,function(){clearTimeout(lp)},true)});
  document.addEventListener('click',function(e){
    if(V.lpDone){V.lpDone=false;if(e.target.closest&&e.target.closest('.vb')){e.stopImmediatePropagation();e.preventDefault()}}
  },true);
})();
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#overlay').hidden)closeSheet()});

if(window.__LUDORIA_TEST)window.__ludoria={st:function(){return ST},mode:function(){return MODE},room:function(){return ROOM},lob:function(){return LOB},fireworks:function(){fireworks()},voiceMenu:function(){voiceMenu()}};
home();
})();
